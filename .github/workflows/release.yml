name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # Only pushes to this repo's main. A fork PR from a branch named "main" also
    # completes CI on "main", and must never reach a job that holds secrets.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore: bump version') }}
    env:
      # Booleans only; each secret is passed to the one step that needs it.
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Load app config
        run: |
          set -a
          # shellcheck source=packaging/app.env
          source packaging/app.env
          set +a
          {
            echo "APP_BUNDLE_NAME=$APP_BUNDLE_NAME"
            echo "APP_EXECUTABLE=$APP_EXECUTABLE"
            echo "APP_DISPLAY_NAME=$APP_DISPLAY_NAME"
            echo "APP_DESCRIPTION=$APP_DESCRIPTION"
            echo "APP_SUPPORT_DIR=$APP_SUPPORT_DIR"
            echo "GITHUB_OWNER=$GITHUB_OWNER"
            echo "GITHUB_REPO=$GITHUB_REPO"
            echo "CASK_NAME=$CASK_NAME"
            echo "HOMEBREW_TAP=$HOMEBREW_TAP"
          } >> "$GITHUB_ENV"

      - name: Bump version if tag exists
        id: version
        run: |
          chmod +x packaging/bump-version.sh
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" packaging/Info.plist)
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            VERSION=$(./packaging/bump-version.sh patch)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add packaging/Info.plist
            git commit -m "chore: bump version to ${VERSION}"
            git checkout -B main
            git push origin main
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # A self-signed identity is usable by codesign once its keychain is on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_IDENTITY=MacMouse Release Signing" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          chmod +x packaging/build-app.sh
          ./packaging/build-app.sh

      - name: Create release zip
        run: |
          COPYFILE_DISABLE=1 ditto -c -k --keepParent \
            "dist/${APP_BUNDLE_NAME}.app" \
            "${APP_BUNDLE_NAME}-${{ steps.version.outputs.version }}.zip"

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.APP_BUNDLE_NAME }} ${{ steps.version.outputs.version }}
          files: ${{ env.APP_BUNDLE_NAME }}-${{ steps.version.outputs.version }}.zip
          make_latest: true
          overwrite_files: true

      - name: Update Homebrew cask
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 "${APP_BUNDLE_NAME}-${VERSION}.zip" | awk '{ print $1 }')
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP}.git" tap
          mkdir -p tap/Casks
          sed \
            -e "s/{{CASK_NAME}}/${CASK_NAME}/g" \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{SHA256}}/${SHA256}/g" \
            -e "s/{{GITHUB_OWNER}}/${GITHUB_OWNER}/g" \
            -e "s/{{GITHUB_REPO}}/${GITHUB_REPO}/g" \
            -e "s/{{APP_BUNDLE_NAME}}/${APP_BUNDLE_NAME}/g" \
            -e "s/{{APP_DISPLAY_NAME}}/${APP_DISPLAY_NAME}/g" \
            -e "s/{{APP_DESCRIPTION}}/${APP_DESCRIPTION}/g" \
            -e "s/{{APP_SUPPORT_DIR}}/${APP_SUPPORT_DIR}/g" \
            packaging/cask.rb.template > "tap/Casks/${CASK_NAME}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK_NAME}.rb"
          git diff --cached --quiet || git commit -m "${CASK_NAME} ${VERSION}"
          git push origin main
